[package]
edition = "2021"
name = "cameraui-rust-postprocessor"
version = "0.0.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
replay = ["dep:serde", "dep:serde_json", "napi/noop", "napi-derive/noop"]

[[bin]]
name = "replay"
required-features = ["replay"]

[[test]]
name = "replay"
required-features = ["replay"]

[dependencies]
napi = { version = "3.12.1", default-features = false, features = ["napi9"] }
napi-derive = "3.6.3"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
trackforge = { path = "./externals/trackforge", default-features = false }
wide = "1.6.1"

[build-dependencies]
napi-build = "2.4.1"

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1
